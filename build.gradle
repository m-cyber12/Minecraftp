/*
 * CraftRealm — root build script.
 *
 * Everything shared by the modules lives here: repositories, the Java 21
 * toolchain, encoding/compiler flags, the Paper API dependency and JUnit.
 * Feature modules only declare their own extra dependencies.
 */

plugins {
    id 'java'
}

allprojects {
    group = project.findProperty('projectGroup') ?: 'io.craftrealm'
    version = project.findProperty('projectVersion') ?: '1.0.0'

    repositories {
        mavenCentral()
        // Paper / Adventure / MiniMessage
        maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
        // ForgeGradle and Forge userdev artifacts
        maven { url = uri('https://maven.minecraftforge.net/') }
        // VaultAPI
        maven { url = uri('https://jitpack.io') }
    }
}

subprojects {
    apply plugin: 'java-library'

    // Paper 1.21 targets Java 21; Forge 1.20.1 runs on Java 17. Keep the
    // native Forge adapter on the runtime's bytecode level while preserving the
    // existing Paper build as a separately compiled legacy target.
    def craftRealmJava = project.name == 'craftrealm-forge' ? 17 : 21

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(craftRealmJava)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = craftRealmJava
        // Fail loudly on the things that bite plugin authors: unchecked misuse of
        // raw Bukkit types and silent deprecation drift.
        options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-parameters']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
    }

    dependencies {
        if (project.name != 'craftrealm-forge') {
            // Paper API is server-provided and only used by the legacy Paper edition.
            compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
            testCompileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
        }

        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // Keep module jars lean; the shipping jar is produced by :craftrealm-plugin.
    jar {
        archiveBaseName = "CraftRealm-${project.name - 'craftrealm-'}"
    }
}

// `./gradlew build` in the root also assembles the distributable plugin jar.
tasks.register('dist') {
    group = 'build'
    description = 'Builds the shaded CraftRealm.jar ready to drop into plugins/'
    dependsOn ':craftrealm-plugin:shadowJar'
}
