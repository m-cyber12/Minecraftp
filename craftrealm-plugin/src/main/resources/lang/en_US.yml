# ===========================================================================
#  CraftRealm — English (en_US)
# ---------------------------------------------------------------------------
#  Every line is MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  Placeholders are written {like-this} and are filled by the plugin. Player
#  names and reasons are escaped before insertion, so a player cannot inject
#  formatting.
#
#  Colour palette (the craftsman's workshop):
#    oak #b07d4f · spruce #6b4a2f · deepslate #36393d · redstone #c0392b
#    gold #e8b339 · copper #c77b53 · emerald #2fbf71 · lava #f26b21
#    parchment #e8d8b0
# ===========================================================================

meta:
  locale: en_US
  name: English

# ---------------------------------------------------------------- framework
command:
  usage: "<#e8d8b0>Usage:</#e8d8b0> <white>{usage}"
  unknown: "<#c0392b>No such command:</#c0392b> <white>{input}"
  no-permission: "<#c0392b>You do not have permission to do that.</#c0392b>"
  player-only: "<#f26b21>That command only works for players.</#f26b21>"
  invalid-amount: "<#c0392b>\"{input}\" is not a valid amount.</#c0392b>"
  invalid-number: "<#c0392b>\"{input}\" is not a valid number.</#c0392b>"
  cooldown: "<#f26b21>Slow down — try again in {seconds}s.</#f26b21>"
  error: "<#c0392b>That did not work: {error}</#c0392b>"
  help-header: "<#e8b339>CraftRealm commands</#e8b339>"
  help-entry: "<#6b4a2f>·</#6b4a2f> <white>{usage}</white> <dark_gray>{description}</dark_gray>"
  unknown-player: "<#c0392b>No player named {player}.</#c0392b>"

gui:
  previous: "<#b07d4f>« Previous page"
  next: "<#b07d4f>Next page »"
  close: "<#c0392b>Close"
  back: "<#b07d4f>Back"
  cancel: "<#c0392b>Cancel"
  confirm: "<#2fbf71>Confirm"
  page: "<#6b4a2f>Page {page} of {pages}"
  empty: "<#6b4a2f>Nothing here yet."

currency:
  name: "Crowns"
  symbol: "⛃"
  format:
    amount: "{amount} ⛃"

# ------------------------------------------------------------ economy results
economy:
  result:
    ok: "<#2fbf71>Done.</#2fbf71>"
    invalid_amount: "<#c0392b>That amount is not valid.</#c0392b>"
    insufficient_funds: "<#c0392b>You do not have enough Crowns for that.</#c0392b>"
    limit_exceeded: "<#f26b21>That is above the per-transaction limit.</#f26b21>"
    rate_limited: "<#f26b21>You are moving money too quickly — wait a moment.</#f26b21>"
    self_transfer: "<#f26b21>You cannot pay yourself.</#f26b21>"
    duplicate_operation: "<#f26b21>That was already processed.</#f26b21>"
    account_frozen: "<#c0392b>Your account is frozen.</#c0392b>"
    no_account: "<#c0392b>No account found for that player.</#c0392b>"
    error: "<#c0392b>The economy could not complete that. Nothing was changed.</#c0392b>"
  balance:
    header: "<#e8b339>Purse of {player}</#e8b339>"
    wallet: "<#6b4a2f>·</#6b4a2f> <#e8b339>Wallet</#e8b339> <white>{amount}</white>"
    bank: "<#6b4a2f>·</#6b4a2f> <#c77b53>Vault</#c77b53> <white>{amount}</white>"
    shards: "<#6b4a2f>·</#6b4a2f> <#2fbf71>Shards</#2fbf71> <white>{amount}</white>"
  baltop:
    header: "<#e8b339>Richest in the realm</#e8b339>"
    entry: "<#6b4a2f>{rank}.</#6b4a2f> <white>{player}</white> <dark_gray>—</dark_gray> <#e8b339>{amount}</#e8b339>"
    empty: "<#6b4a2f>No accounts have been opened yet.</#6b4a2f>"
  pay:
    self: "<#f26b21>You cannot pay yourself.</#f26b21>"
    too-small: "<#c0392b>The minimum transfer is {min}.</#c0392b>"
    sent: "<#2fbf71>Sent {amount} to {player}.</#2fbf71> <dark_gray>(balance: {balance})</dark_gray>"
    received: "<#2fbf71>{player} sent you {amount}.</#2fbf71> <dark_gray>(balance: {balance})</dark_gray>"

# ------------------------------------------------------------------ /balance
balance:
  self: "<#e8b339>Wallet:</#e8b339> <white>{balance}</white>"
  self-full: "<#e8b339>Wallet:</#e8b339> <white>{balance}</white> <dark_gray>·</dark_gray> <#2fbf71>Shards:</#2fbf71> <white>{shards}</white> <dark_gray>·</dark_gray> <#c77b53>Bank:</#c77b53> <white>{bank}</white>"
  other: "<#e8b339>{player}</#e8b339> has <white>{balance}</white>"
  hidden: "<#c0392b>That player keeps their balance private.</#c0392b>"

# ---------------------------------------------------------------------- /pay
pay:
  sent: "<#2fbf71>Sent {amount} to {player}.</#2fbf71> <dark_gray>(balance: {balance})</dark_gray>"
  received: "<#2fbf71>{player} sent you {amount}.</#2fbf71> <dark_gray>(balance: {balance})</dark_gray>"
  minimum: "<#c0392b>The minimum transfer is {minimum}.</#c0392b>"
  offline: "<#c0392b>{player} is not online.</#c0392b>"
  confirm: "<#f26b21>{amount} is a large transfer — type the command again within 30s to confirm.</#f26b21>"

# ------------------------------------------------------------------- /baltop
baltop:
  header: "<#e8b339>Richest in the realm</#e8b339> <dark_gray>(page {page}/{pages})</dark_gray>"
  entry: "<#6b4a2f>{rank}.</#6b4a2f> <white>{player}</white> <dark_gray>—</dark_gray> <#e8b339>{balance}</#e8b339>"
  empty: "<#6b4a2f>No accounts have been opened yet.</#6b4a2f>"
  you: "<#2fbf71>You are #{rank} with {balance}.</#2fbf71>"

# --------------------------------------------------------------------- /shop
shop:
  title: "<#6b4a2f>Market Hall"
  category:
    name: "<#e8b339>{category}</#e8b339>"
    lore: "<#6b4a2f>Click to browse.</#6b4a2f>"
    empty: "<#6b4a2f>This shelf is empty.</#6b4a2f>"
  item:
    name: "<white>{item}</white>"
    lore: |-
      <#6b4a2f>Buy:</#6b4a2f> <white>{buy}</white>
      <#6b4a2f>Sell:</#6b4a2f> <white>{sell}</white>
      <#6b4a2f>Trend:</#6b4a2f> <white>{trend}</white>
      <dark_gray>Left-click buy 1 · Right-click sell 1
      Shift-click for a stack</dark_gray>
  bought: "<#2fbf71>Bought {amount}× {item} for {total}.</#2fbf71>"
  sold: "<#2fbf71>Sold {amount}× {item} for {total}.</#2fbf71>"
  sell-button:
    name: "<#2fbf71>Sell everything in your hand"
    lore: "<#6b4a2f>Opens the sell counter.</#6b4a2f>"
  trend:
    up: "<#2fbf71>▲ rising"
    down: "<#f26b21>▼ falling"
    flat: "<#6b4a2f>▬ steady"
  disabled: "<#c0392b>The market is closed right now.</#c0392b>"
  blacklisted: "<#c0392b>That item cannot be traded.</#c0392b>"
  quote:
    lore: |-
      <#6b4a2f>Market:</#6b4a2f> <white>{price}</white>
      <#6b4a2f>Anchor:</#6b4a2f> <white>{base}</white>
      <dark_gray>Prices drift back toward the anchor.</dark_gray>
  unknown-category: "<#c0392b>No shelf named {category}.</#c0392b>"

# --------------------------------------------------------------------- /sell
sell:
  title: "<#6b4a2f>Sell Counter"
  info:
    name: "<#e8b339>How selling works"
    line: "<#6b4a2f>Drop items in the top rows, then close.</#6b4a2f>"
    more: "<#6b4a2f>Prices move with supply and demand.</#6b4a2f>"
    lore: |-
      <#6b4a2f>Items:</#6b4a2f> <white>{items}</white>
      <#6b4a2f>Payout:</#6b4a2f> <#2fbf71>{total}</#2fbf71>
      <dark_gray>Close the counter to sell.</dark_gray>
  close-lore: "<#2fbf71>Click to sell and close.</#2fbf71>"
  nothing: "<#6b4a2f>There was nothing to sell.</#6b4a2f>"
  result: "<#2fbf71>Sold {count} items for {total}.</#2fbf71>"
  returned: "<#f26b21>Some items could not be sold and were returned.</#f26b21>"
  confirm:
    lore: |-
      <#6b4a2f>Payout:</#6b4a2f> <#2fbf71>{total}</#2fbf71>
      <dark_gray>Click to sell every item above.</dark_gray>
  sold: "<#2fbf71>Sold everything for {total} — balance {balance}.</#2fbf71>"

# --------------------------------------------------------------------- /bank
bank:
  title: "<#6b4a2f>Vault of Crowns"
  vault:
    name: "<#e8b339>Savings</#e8b339>"
    lore: |-
      <#6b4a2f>Balance:</#6b4a2f> <white>{balance}</white>
      <#6b4a2f>Interest due:</#6b4a2f> <#2fbf71>{interest}</#2fbf71>
      <#6b4a2f>Rate:</#6b4a2f> <white>{rate}% per {period}h</white>
  deposit:
    name: "<#2fbf71>Deposit</#2fbf71>"
    lore: "<#6b4a2f>Left: 1,000 · Right: everything</#6b4a2f>"
  withdraw:
    name: "<#f26b21>Withdraw</#f26b21>"
    lore: "<#6b4a2f>Left: 1,000 · Right: everything</#6b4a2f>"
  interest:
    name: "<#2fbf71>Interest</#2fbf71>"
    lore: "<#6b4a2f>Credited automatically every period.</#6b4a2f>"
  loan:
    name: "<#e8b339>Loans</#e8b339>"
    lore: |-
      <#6b4a2f>Limit:</#6b4a2f> <white>{limit}</white>
      <#6b4a2f>Daily rate:</#6b4a2f> <white>{rate}%</white>
    active: "<#f26b21>Outstanding: {amount} due {due}</#f26b21>"
    none: "<#6b4a2f>You have no open loans.</#6b4a2f>"
    active-lore: |-
      <#6b4a2f>Outstanding:</#6b4a2f> <#f26b21>{outstanding}</#f26b21>
      <#6b4a2f>Principal:</#6b4a2f> <white>{principal}</white>
      <#6b4a2f>Due:</#6b4a2f> <white>{due}</white>
      <#6b4a2f>Left:</#6b4a2f> <white>{remaining}</white>
    denied: "<#c0392b>The bank declined that loan.</#c0392b>"
    not-eligible: "<#c0392b>You are not eligible for a loan yet.</#c0392b>"
    repaid: "<#2fbf71>Repaid {amount} — {remaining} left.</#2fbf71>"
    taken: "<#e8b339>Borrowed {amount}; you owe {owed} by {due}.</#e8b339>"
  deposited: "<#2fbf71>Deposited {amount}.</#2fbf71>"
  withdrawn: "<#2fbf71>Withdrew {amount}.</#2fbf71>"
  loan-taken: "<#e8b339>Loan of {amount} issued — repay by {due}.</#e8b339>"
  loan-repaid: "<#2fbf71>Repaid {amount}.</#2fbf71>"
  loan-limit: "<#c0392b>Your limit is {limit}.</#c0392b>"
  loan-overdue: "<#c0392b>A loan is overdue — a {penalty}% penalty was applied.</#c0392b>"
  disabled: "<#c0392b>Loans are disabled on this server.</#c0392b>"

# ------------------------------------------------------------------ /auction
auction:
  title: "<#6b4a2f>Auction House"
  sell:
    name: "<#2fbf71>List the item in your hand</#2fbf71>"
    lore: |-
      <#6b4a2f>Fee:</#6b4a2f> <white>{fee}</white>
      <#6b4a2f>Sales tax:</#6b4a2f> <white>{tax}%</white>
    listed: "<#2fbf71>{item} listed at {price}.</#2fbf71>"
    empty-hand: "<#c0392b>Hold the item you want to auction.</#c0392b>"
    changed-hand: "<#f26b21>The item in your hand changed — start again.</#f26b21>"
    item-moved: "<#f26b21>Keep the item in your hand until it is listed.</#f26b21>"
    failed: "<#c0392b>The listing could not be created.</#c0392b>"
  listing:
    title: "<#6b4a2f>Set your price"
    name: "<white>{item}</white>"
    lore: |-
      <#6b4a2f>Starting bid:</#6b4a2f> <white>{start}</white>
      <#6b4a2f>Buy-now:</#6b4a2f> <white>{buy}</white>
      <#6b4a2f>Ends in:</#6b4a2f> <white>{time}</white>
      <dark_gray>Left: raise · Right: lower · Shift: confirm</dark_gray>
    raise: "<#2fbf71>Starting bid raised to {amount}.</#2fbf71>"
    lower: "<#f26b21>Starting bid lowered to {amount}.</#f26b21>"
    confirm: "<#2fbf71>Listed for {amount} — good luck.</#2fbf71>"
    too-many: "<#c0392b>You already have {count} active listings.</#c0392b>"
    no-funds: "<#c0392b>You cannot pay the {fee} listing fee.</#c0392b>"
    not-held: "<#c0392b>Hold the item you want to sell.</#c0392b>"
    hint: |-
      <dark_gray>Left: raise by 10% · Right: lower by 10%
      Shift + left: confirm the listing</dark_gray>
    quote: |-
      <#6b4a2f>Starting bid:</#6b4a2f> <white>{start}</white>
      <#6b4a2f>Buy-now:</#6b4a2f> <white>{buy}</white>
      <#6b4a2f>Fee:</#6b4a2f> <white>{fee}</white>
    confirm-lore: |-
      <#6b4a2f>Fee charged now:</#6b4a2f> <white>{fee}</white>
      <dark_gray>Shift + click to list it.</dark_gray>
  bid-placed: "<#2fbf71>Bid {amount} placed.</#2fbf71>"
  bid-too-low: "<#c0392b>The minimum bid is {minimum}.</#c0392b>"
  bought: "<#2fbf71>You bought {item} for {amount}.</#2fbf71>"
  outbid: "<#f26b21>You were outbid on {item}.</#f26b21>"
  expired: "<#6b4a2f>Your listing for {item} expired — it is waiting in your mailbox.</#6b4a2f>"
  cancelled: "<#f26b21>Listing cancelled; the item is in your mailbox.</#f26b21>"
  mailbox:
    title: "<#6b4a2f>Mailbox"
    name: "<#6b4a2f>Mailbox</#6b4a2f>"
    info: "<#6b4a2f>Collect what the auction house owes you.</#6b4a2f>"
    item:
      name: "<white>{item}</white>"
      lore: "<#2fbf71>Click to collect.</#2fbf71>"
    money:
      name: "<#e8b339>{amount}</#e8b339>"
      lore: "<#2fbf71>Click to collect.</#2fbf71>"
    collected: "<#2fbf71>Collected {what}.</#2fbf71>"
    full: "<#f26b21>Your inventory is full — make room first.</#f26b21>"
    empty: "<#6b4a2f>Your mailbox is empty.</#6b4a2f>"
    lore: "<#6b4a2f>{count} uncollected entries.</#6b4a2f>"
    entry:
      lore: |-
        <#6b4a2f>{note}</#6b4a2f>
        <dark_gray>Arrived {time}</dark_gray>

# --------------------------------------------------------------------- /jobs
jobs:
  title: "<#6b4a2f>Careers"
  entry:
    name: "<#e8b339>{job}</#e8b339> <dark_gray>(level {level})</dark_gray>"
    unit: "blocks"
    lore: |-
      <#6b4a2f>Level:</#6b4a2f> <white>{level}/{max}</white>
      <#6b4a2f>Progress:</#6b4a2f> <white>{xp}/{required}</white>
      <#6b4a2f>Multiplier:</#6b4a2f> <#2fbf71>×{multiplier}</#2fbf71>
      <#6b4a2f>Earned today:</#6b4a2f> <white>{earned}</white>
  how:
    title: "<#e8b339>How jobs pay"
    lore: |-
      <#6b4a2f>Work in the world and get paid in Crowns.</#6b4a2f>
      <#6b4a2f>Levels raise your multiplier up to {max}×.</#6b4a2f>
      <#6b4a2f>Blocks you place yourself never pay.</#6b4a2f>
  level-up: "<#2fbf71>{job} reached level {level}!</#2fbf71>"
  cap: "<#f26b21>{job} hit its daily cap — it pays again tomorrow.</#f26b21>"
  switched: "<#e8b339>You now follow {job}.</#e8b339>"
  miner:
    name: "<#6b4a2f>Miner</#6b4a2f>"
  farmer:
    name: "<#2fbf71>Farmer</#2fbf71>"
  hunter:
    name: "<#c0392b>Hunter</#c0392b>"
  fisher:
    name: "<#c77b53>Fisher</#c77b53>"
  builder:
    name: "<#e8b339>Builder</#e8b339>"

# ------------------------------------------------------------------- /bounty
bounty:
  title: "<#6b4a2f>Bounty Board"
  entry:
    name: "<#c0392b>{player}</#c0392b> <dark_gray>—</dark_gray> <#e8b339>{amount}</#e8b339>"
    lore: "<#6b4a2f>Placed {when} by {placer}</#6b4a2f>"
    hint: "<#6b4a2f>Raise the bounty on {player} with</#6b4a2f> <#e8b339>{command}</#e8b339>"
  empty:
    name: "<#6b4a2f>No open bounties.</#6b4a2f>"
    lore: "<#6b4a2f>Place one with /bounty place <player> <amount>.</#6b4a2f>"
  how:
    name: "<#e8b339>How bounties work"
    lore: |-
      <#6b4a2f>Escrowed when placed, paid to the killer.</#6b4a2f>
      <#6b4a2f>Fee:</#6b4a2f> <white>{fee}%</white>
  placed: "<#e8b339>Bounty of {amount} placed on {player}.</#e8b339>"
  claimed: "<#e8b339>You claimed the {amount} bounty on {player}.</#e8b339>"
  claimed-broadcast: "<#e8b339>{killer}</#e8b339> <#6b4a2f>collected the</#6b4a2f> <white>{amount}</white> <#6b4a2f>bounty on</#6b4a2f> <#c0392b>{player}</#c0392b>"
  too-small: "<#c0392b>The minimum bounty is {minimum}.</#c0392b>"
  too-large: "<#c0392b>The maximum bounty is {maximum}.</#c0392b>"
  self: "<#f26b21>You cannot put a bounty on yourself.</#f26b21>"
  none: "<#6b4a2f>There is no bounty on that player.</#6b4a2f>"

# -------------------------------------------------------------- coins/notes
coins:
  minted-coin: "<#e8b339>Minted a coin worth {amount}.</#e8b339>"
  minted-note: "<#e8b339>Signed a banknote worth {amount}.</#e8b339>"
  redeemed: "<#2fbf71>Cashed in {amount}. Balance: {balance}</#2fbf71>"
  already-redeemed: "<#f26b21>That note has already been cashed in.</#f26b21>"
  forged: "<#c0392b>That note's signature is invalid.</#c0392b>"
  invalid: "<#c0392b>That is not a CraftRealm coin or note.</#c0392b>"
  hold-one: "<#f26b21>Hold exactly one coin or note to cash it in.</#f26b21>"

item:
  coin:
    name: "<#e8b339>Gold Coin</#e8b339>"
    lore: |-
      <#6b4a2f>Worth:</#6b4a2f> <white>{amount}</white>
      <#6b4a2f>Right-click to deposit.</#6b4a2f>
      <dark_gray>Serial {id}</dark_gray>
  note:
    name: "<#e8d8b0>Banknote</#e8d8b0>"
    lore: |-
      <#6b4a2f>Promise to pay the bearer:</#6b4a2f> <white>{amount}</white>
      <#6b4a2f>Issued by:</#6b4a2f> <white>{issuer}</white>
      <#6b4a2f>Right-click to deposit.</#6b4a2f>
      <dark_gray>Serial {id}</dark_gray>

# -------------------------------------------------------------------- claims
claims:
  gui:
    title: "<#6b4a2f>Your Land"
    entry:
      name: "<#e8b339>Claim #{id}</#e8b339>"
      lore: |-
        <#6b4a2f>World:</#6b4a2f> <white>{world}</white>
        <#6b4a2f>Chunk:</#6b4a2f> <white>{x}, {z}</white>
        <#6b4a2f>Area:</#6b4a2f> <white>{area} blocks</white>
        <#6b4a2f>Upkeep:</#6b4a2f> <white>{upkeep}/day</white>
        <#6b4a2f>Paid until:</#6b4a2f> <white>{paid}</white>
        <#6b4a2f>State:</#6b4a2f> <white>{stage}</white>
        <dark_gray>Shift-click to abandon.</dark_gray>
    empty: "<#6b4a2f>You do not own any land yet.</#6b4a2f>"
    new:
      name: "<#2fbf71>Claim the land here</#2fbf71>"
      lore: "<#6b4a2f>Stand where you want the centre, then run /claim create 4</#6b4a2f>"
      hint: "<#e8b339>/claim create <radius></#e8b339> claims a square around you."
  created: "<#2fbf71>Claimed {area} blocks — upkeep {upkeep} per day.</#2fbf71>"
  buying: "<#e8b339>Claiming {area} blocks for {price}…</#e8b339>"
  failed: "<#c0392b>Claim failed: {reason}</#c0392b>"
  protected: "<#c0392b>This land belongs to someone else.</#c0392b>"
  free: "<#6b4a2f>This land is unclaimed.</#6b4a2f>"
  info: "<#e8b339>Owned by {owner}</#e8b339> <dark_gray>·</dark_gray> <white>{area} blocks</white> <dark_gray>·</dark_gray> <#6b4a2f>upkeep {upkeep}/day, paid until {paid}</#6b4a2f>"
  removed: "<#f26b21>Claim released.</#f26b21>"
  not-found: "<#c0392b>No such claim.</#c0392b>"
  list-header: "<#e8b339>Your claims</#e8b339> <dark_gray>({count})</dark_gray>"
  list-entry: "<#6b4a2f>#{id}</#6b4a2f> <white>{world} {x},{z}</white> <dark_gray>·</dark_gray> <white>{area} blocks</white> <dark_gray>·</dark_gray> <#6b4a2f>stage {stage}, paid {paid}</#6b4a2f>"
  upkeep-missed: "<#f26b21>Upkeep for claim #{id} could not be paid.</#f26b21>"

# ------------------------------------------------------------------- quests
quests:
  gui:
    title: "<#6b4a2f>Quest Board"
    header: "<#e8b339>Daily and weekly work</#e8b339>"
    header-lore: |-
      <#6b4a2f>Finish a quest, then click it to collect.</#6b4a2f>
      <#6b4a2f>Daily quests expire at midnight.</#6b4a2f>
    entry:
      name: "<white>{title}</white>"
      lore: |-
        <#6b4a2f>Progress:</#6b4a2f> <white>{progress}</white>
        <#6b4a2f>{bar}</#6b4a2f>
        <#6b4a2f>Reward:</#6b4a2f> <#2fbf71>{reward}</#2fbf71>
        <#6b4a2f>Expires in:</#6b4a2f> <white>{expires}</white>
  not-complete: "<#f26b21>That quest is not finished yet.</#f26b21>"
  claimed: "<#2fbf71>Quest complete: {title}.</#2fbf71>"
  claim-failed: "<#c0392b>That quest could not be collected.</#c0392b>"
  completed-broadcast: "<#e8b339>{player}</#e8b339> <#6b4a2f>completed a quest.</#6b4a2f>"

# ----------------------------------------------------------------- seasons
seasons:
  gui:
    title: "<#6b4a2f>The Season"
    header:
      name: "<#e8b339>Season {number}</#e8b339>"
