name: Build

# Compiles, tests and packages CraftRealm on every push and pull request.
# The shaded plugin jar and the resource-pack zip are attached to the run so a
# release candidate can be downloaded without a local JDK.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle and the wrapper distribution between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Kept separate from `test` so a compile error is reported in seconds and
      # shows up as its own failing step.
      - name: Compile
        run: ./gradlew compileJava compileTestJava --stacktrace --console=plain

      - name: Unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Package
        run: >-
          ./gradlew :craftrealm-plugin:shadowJar
          :craftrealm-plugin:buildResourcePack
          --stacktrace --console=plain

      - name: Upload plugin jar and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: CraftRealm
          if-no-files-found: error
          path: |
            craftrealm-plugin/build/libs/*.jar
            craftrealm-plugin/build/dist/*.zip

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          path: '**/build/reports/tests/**'
