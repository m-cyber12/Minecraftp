name: Build

# Use GitHub's Java 21 runner as the compiler, test runner and packager.
# Every push, pull request and manual dispatch gets the same reproducible build.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 17 + 21 / Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Java 17 Forge toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK 21 for Paper modules and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # This step is the compiler gate. It mirrors javac errors into GitHub
      # check annotations as well as retaining the full Gradle log in the run.
      - name: Compile production and test sources
        shell: bash
        run: |
          set +e
          ./gradlew compileJava compileTestJava :craftrealm-forge:compileJava :craftrealm-forge:compileTestJava --stacktrace --console=plain 2>&1 | tee compile.log
          result=${PIPESTATUS[0]}
          python3 .github/scripts/report_compile.py compile.log
          exit "$result"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew test --stacktrace --console=plain 2>&1 | tee tests.log
          result=${PIPESTATUS[0]}
          python3 .github/scripts/report_tests.py
          exit "$result"

      - name: Build Forge mod, legacy Paper jar and resource pack
        shell: bash
        run: |
          set +e
          ./gradlew :craftrealm-forge:reobfJarJar :craftrealm-plugin:shadowJar :craftrealm-plugin:buildResourcePack --stacktrace --console=plain 2>&1 | tee package.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 .github/scripts/report_build.py package.log
          fi
          exit "$result"

      - name: Upload Forge 1.20.1 mod
        uses: actions/upload-artifact@v4
        with:
          name: CraftRealm-Forge-1.20.1
          if-no-files-found: error
          path: craftrealm-forge/build/libs/*all.jar

      - name: Upload legacy Paper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CraftRealm-Paper-legacy
          if-no-files-found: error
          path: |
            craftrealm-plugin/build/libs/CraftRealm-1.0.0.jar
            craftrealm-plugin/build/dist/CraftRealm-ResourcePack.zip

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          path: '**/build/reports/tests/**'
