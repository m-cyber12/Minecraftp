name: Build

# Use GitHub's Java 21 runner as the compiler, test runner and packager.
# Every push, pull request and manual dispatch gets the same reproducible build.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # This step is the compiler gate. It mirrors javac errors into GitHub
      # check annotations as well as retaining the full Gradle log in the run.
      - name: Compile production and test sources
        shell: bash
        run: |
          set +e
          ./gradlew compileJava compileTestJava --stacktrace --console=plain 2>&1 | tee compile.log
          result=${PIPESTATUS[0]}
          python3 .github/scripts/report_compile.py compile.log
          exit "$result"

      - name: Run unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Build plugin jar and resource pack
        run: >-
          ./gradlew :craftrealm-plugin:shadowJar
          :craftrealm-plugin:buildResourcePack
          --stacktrace --console=plain

      - name: Upload plugin jar and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: CraftRealm
          if-no-files-found: error
          path: |
            craftrealm-plugin/build/libs/*.jar
            craftrealm-plugin/build/dist/*.zip

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          path: '**/build/reports/tests/**'
