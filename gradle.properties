# ---------------------------------------------------------------------------
# CraftRealm build properties
# ---------------------------------------------------------------------------
# Bump these in one place; every module inherits them through the root project.
projectGroup=io.craftrealm
projectVersion=1.0.0

# --- Platform ---------------------------------------------------------------
minecraftVersion=1.21.4
paperApiVersion=1.21.4-R0.1-SNAPSHOT

# --- Third party ------------------------------------------------------------
adventureVersion=4.20.0
hikariVersion=5.1.0
sqliteVersion=3.46.1.3
mysqlVersion=8.4.0
javalinVersion=6.3.0
vaultApiVersion=1.7
junitVersion=5.10.2

# --- Build ------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# CI installs both runtimes; keep Forge's Java 17 compiler discoverable after
# Java 21 is selected to run Gradle and the legacy Paper build.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
org.gradle.parallel=true
org.gradle.caching=true
